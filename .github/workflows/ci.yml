# Builds and tests every part of Renova on each push and pull request.
name: CI

on:
  push:
    branches: [main, production]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine, CLI, web API and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/"

  console:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The build writes the route types (LayoutProps and friends) the type check needs, so it goes first.
      - run: npm run build
      - run: npx tsc --noEmit

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ide/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json
      - run: npm ci
      - run: npm test

  intellij:
    name: IntelliJ plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install the engine into the local Maven repository
        run: mvn -B -q install -DskipTests
      - uses: gradle/actions/setup-gradle@v4
      # The build downloads IntelliJ IDEA itself from JetBrains, and that download fails now and then: the
      # step is tried up to three times before the job is called failed.
      - name: Build and test the plugin
        working-directory: ide/intellij
        run: |
          for attempt in 1 2 3; do
            ./gradlew buildPlugin test --stacktrace && exit 0
            echo "::warning::Attempt $attempt of the IntelliJ plugin build failed"
            sleep 30
          done
          exit 1
      - name: Keep the reports when the plugin build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intellij-reports
          path: |
            ide/intellij/build/reports/
            ide/intellij/build/test-results/
