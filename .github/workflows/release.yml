# Publishes a release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Every part is built at that version and attached to a GitHub release: the desktop installers for Linux,
# Windows and macOS, the web bundle, the CLI, the VS Code extension and the IntelliJ plugin. Nothing is
# published anywhere else, and no container image is involved.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify

  bundles:
    name: Web bundle, CLI and IDE plugins
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set the version from the tag
        run: |
          v="${VERSION#v}"
          mvn -B -q versions:set -DnewVersion="$v" -DgenerateBackupPoms=false
          sed -i "s/^renovaVersion=.*/renovaVersion=$v/; s/^pluginVersion=.*/pluginVersion=$v/" ide/intellij/gradle.properties
          (cd ide/vscode && npm version "$v" --no-git-tag-version --allow-same-version)
      - name: Install the engine into the local Maven repository
        run: mvn -B -q install -DskipTests
      - name: Web bundle
        run: web/package.sh
      - name: CLI
        run: cli/package.sh
      - name: VS Code extension
        working-directory: ide/vscode
        run: npm ci && npm run package
      # Without the Gradle cache: a run cancelled mid-build saved a half-written one on main, and every run that
      # restored it failed within seconds. The build is tried again if a download fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      # The build downloads IntelliJ IDEA itself from JetBrains, and that download fails now and then.
      - name: IntelliJ plugin
        working-directory: ide/intellij
        run: |
          for attempt in 1 2 3; do
            ./gradlew buildPlugin --stacktrace && exit 0
            echo "::warning::Attempt $attempt of the IntelliJ plugin build failed"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          if-no-files-found: error
          path: |
            web/target/renova-web-*.tar.gz
            cli/target/renova-cli-*.zip
            ide/vscode/renova-*.vsix
            ide/intellij/build/distributions/*.zip

  desktop:
    name: Desktop installer (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, type: "deb,rpm,tar.gz,pkg.tar.zst" }
          - { name: Windows, os: windows-latest, type: msi }
          # One installer for each kind of Mac: the bundled Java runtime and JavaFX are built for one chip.
          - { name: macOS Apple Silicon, os: macos-latest, type: dmg }
          - { name: macOS Intel, os: macos-15-intel, type: dmg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Set the version from the tag
        shell: bash
        run: mvn -B -q versions:set -DnewVersion="${VERSION#v}" -DgenerateBackupPoms=false
      - name: Packaging tools for the Linux formats
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm fakeroot zstd
      - name: Build the installer
        shell: bash
        run: desktop/package.sh --type "${{ matrix.type }}"
      # Each package is installed on the distribution it is for: one that does not install is not published.
      # Installing registers the menu entry, which needs the folders a desktop has and a bare image lacks.
      - name: Check the Arch package installs and the application starts on Arch
        if: runner.os == 'Linux'
        working-directory: desktop/target/dist
        run: |
          set +e
          out=$(docker run --rm -v "$PWD:/d:ro" archlinux:latest sh -c '
            pacman -Sy --noconfirm > /dev/null 2>&1
            pacman -U --noconfirm /d/*.pkg.tar.zst > /tmp/pacman.log 2>&1 || { tail -15 /tmp/pacman.log; echo "result=not-installed"; exit; }
            test -L /usr/bin/renova-desktop && test -f /usr/share/applications/renova.desktop || { echo "result=no-menu-entry"; exit; }
            pacman -S --noconfirm xorg-server-xvfb xorg-xauth > /dev/null 2>&1
            xvfb-run -a timeout 30 renova-desktop; echo "result=$?"' 2>&1)
          echo "$out"
          echo "$out" | grep -q "result=124" || { echo "::error::Renova from the Arch package did not stay running: $(echo "$out" | tail -c 1500 | tr '\n' ' ')"; exit 1; }
      - name: Check the rpm installs and the application starts on Fedora
        if: runner.os == 'Linux'
        working-directory: desktop/target/dist
        run: |
          set +e
          out=$(docker run --rm -v "$PWD:/d:ro" fedora:latest sh -c '
            mkdir -p /usr/share/desktop-directories /usr/share/applications /etc/xdg/menus
            dnf install -y -q xorg-x11-server-Xvfb xorg-x11-xauth /d/*.rpm > /tmp/dnf.log 2>&1 || { tail -15 /tmp/dnf.log; echo "result=not-installed"; exit; }
            test -f /opt/renova/lib/renova-Renova.desktop || { echo "result=no-menu-entry"; exit; }
            xvfb-run -a timeout 30 /opt/renova/bin/Renova; echo "result=$?"' 2>&1)
          echo "$out"
          # 124: still running when the 30 seconds were up, which is what a started application does.
          echo "$out" | grep -q "result=124" || { echo "::error::Renova from the rpm did not stay running on Fedora: $(echo "$out" | tail -c 1500 | tr '\n' ' ')"; exit 1; }
      - name: Check the deb installs and the application starts on Debian
        if: runner.os == 'Linux'
        working-directory: desktop/target/dist
        run: |
          set +e
          out=$(docker run --rm -v "$PWD:/d:ro" debian:stable-slim sh -c '
            mkdir -p /usr/share/desktop-directories /usr/share/applications /etc/xdg/menus /usr/share/man/man1
            apt-get update -q > /dev/null
            apt-get install -y -q xvfb xauth /d/*.deb > /tmp/apt.log 2>&1 || { tail -15 /tmp/apt.log; echo "result=not-installed"; exit; }
            test -f /opt/renova/lib/renova-Renova.desktop || { echo "result=no-menu-entry"; exit; }
            xvfb-run -a timeout 30 /opt/renova/bin/Renova; echo "result=$?"' 2>&1)
          echo "$out"
          echo "$out" | grep -q "result=124" || { echo "::error::Renova from the deb did not stay running on Debian: $(echo "$out" | tail -c 1500 | tr '\n' ' ')"; exit 1; }
      - name: Check the tarball unpacks
        if: runner.os == 'Linux'
        working-directory: desktop/target/dist
        run: mkdir /tmp/unpacked && tar -xzf renova-*-linux-*.tar.gz -C /tmp/unpacked && test -x /tmp/unpacked/Renova/bin/Renova
      # The installed application is started and has to stay running: an installer that installs and then does
      # not open is not published. What it printed is put in an annotation when it stops.
      - name: Check the application starts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q xvfb libgtk-3-0 libxtst6 libgl1 > /dev/null
          set +e
          xvfb-run -a timeout 30 /tmp/unpacked/Renova/bin/Renova > start.log 2>&1
          code=$?
          if [ "$code" != "124" ]; then echo "::error::Renova stopped by itself on Linux (exit $code): $(tail -c 1500 start.log | tr '\n' ' ')"; exit 1; fi
      - name: Check the application starts (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach desktop/target/dist/*.dmg -nobrowse -mountpoint /tmp/renova-dmg
          cp -R /tmp/renova-dmg/Renova.app /tmp/Renova.app
          hdiutil detach /tmp/renova-dmg
          codesign -dv /tmp/Renova.app 2>&1 | head -5 || true
          /tmp/Renova.app/Contents/MacOS/Renova > start.log 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 "$pid" 2>/dev/null; then wait "$pid"; echo "::error::Renova stopped by itself on macOS (exit $?): $(tail -c 1500 start.log | tr '\n' ' ')"; exit 1; fi
          kill "$pid"
      - name: Check the application installs and starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem desktop/target/dist/*.msi).FullName
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart /l*v install.log" -Wait -PassThru
          $exe = "C:\Program Files\Renova\Renova.exe"
          if ($install.ExitCode -ne 0 -or !(Test-Path $exe)) {
            Write-Output "::error::The installer did not install Renova (exit $($install.ExitCode)): $((Get-Content install.log -Tail 12) -join ' ')"
            exit 1
          }
          $menu = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "Renova*.lnk"
          if (!$menu) { Write-Output "::error::The installer made no Start menu entry"; exit 1 }
          $app = Start-Process $exe -PassThru -RedirectStandardError start-err.log -RedirectStandardOutput start-out.log
          Start-Sleep -Seconds 30
          if ($app.HasExited) {
            Write-Output "::error::Renova stopped by itself on Windows (exit $($app.ExitCode)): $((Get-Content start-err.log, start-out.log -Tail 20) -join ' ')"
            exit 1
          }
          Stop-Process -Id $app.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: desktop/target/dist/*

  publish:
    name: Publish the release
    needs: [bundles, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Gather the files and their checksums
        run: |
          # Artifacts keep the folders their files were built in; a release is one flat list.
          mkdir release
          find assets -type f -exec mv {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" release/* --title "Renova ${VERSION#v}" --generate-notes --verify-tag
