# Publishes the website (the website folder, as it is: no build step) to GitHub Pages when it changes on main.
# Needs Pages switched on once: Settings → Pages → Source: GitHub Actions.
#
# GitHub lets only the branches named in Settings → Environments → github-pages deploy, and names only main
# there to begin with. main and production are pushed together, so the site is published from main. To publish
# from production instead, add it to that list and change the branch below.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
