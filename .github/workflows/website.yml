# Publishes the website (the website folder, as it is: no build step) to GitHub Pages when it changes on
# production or main. Needs Pages switched on once: Settings → Pages → Source: GitHub Actions.
#
# GitHub lets only the branches named in Settings → Environments → github-pages deploy, and names only the
# default branch there to begin with. Until production is added to that list its runs are refused and the
# run from main publishes the site.
name: Website

on:
  push:
    branches: [production, main]
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
