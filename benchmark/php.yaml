# Renova PHP suite: one app per path, each expected to pass with composer.json edits, Rector and text rules
# alone, without an AI key. Needs PHP 8.4 (found on the PATH, in RENOVA_PHP or ~/.local/share/renova/php) and Composer.
#
# Run: benchmark/fetch-public.sh                       (once: fetches the public project below)
#      cli/bin/renova benchmark --suite benchmark/php.yaml --out <empty dir> --configs deterministic

id: php-targets
appsDir: ../../renova-test-apps

# behaviour: after a passing verification, the original and the migrated application run side by side in Docker
# (web applications; libraries are reported as skipped). Not part of whether a run passes: the Laravel 8 and 10
# welcome pages print the framework's version, which differs by design.
configurations:
  - id: deterministic
    behaviour: true

apps:
  # A library written for PHP 7.4 with PHPUnit 7 tests: each(), curly-brace string offsets, implode() with its
  # arguments reversed, the (real) cast, "${var}" in strings, @expectedException, setUp() without a return type.
  - id: php74-library-to-84
    path: ledger-php74
    playbook: php-to-8.4
    checks:
      - { file: composer.json, contains: '"php": "^8.4"', why: "the project says which PHP it runs on" }
      - { file: composer.json, contains: '"phpunit/phpunit": "^9.6"', why: "a PHPUnit that installs on PHP 8" }
      - { file: composer.json, contains: "fakerphp/faker", why: "the abandoned faker package has a successor" }
      - { file: "src/*.php", absent: "each(", why: "removed in PHP 8" }
      - { file: tests/AccountTest.php, contains: "expectException(\\RuntimeException::class)", why: "the test still checks for the exception" }
      - { file: tests/AccountTest.php, contains: "Withdrawing 100.01 would pass the overdraft limit.", why: "and for its message" }

  # A project nobody wrote for Renova: FastRoute 1.3.0, the router under Slim and Lumen, written for PHP 5.4
  # with PHPUnit 4.8. 204 tests.
  - id: fastroute-13-to-84
    path: public/fastroute-1.3
    playbook: php-to-8.4
    checks:
      - { file: composer.json, contains: '"php": "^8.4"', why: "on the target" }
      - { file: composer.json, contains: '"phpunit/phpunit": "^9.6"', why: "a PHPUnit that installs on PHP 8" }
      - { file: test/HackTypechecker/fixtures/all_options.php, contains: "<?hh", why: "a fixture in another language is left exactly as it was" }
      - { file: "test/**/*Test.php", absent: "setExpectedException", why: "PHPUnit 4's way of expecting an exception is gone" }

  # Laravel 10, a real application skeleton with an orders API and its feature tests.
  - id: laravel-10-to-13
    path: orders-laravel10
    playbook: laravel-13
    checks:
      - { file: composer.json, contains: '"laravel/framework": "^13.0"', why: "on the target" }
      - { file: composer.json, contains: '"laravel/tinker": "^2.10.1|^3.0"', why: "a constraint that can reach the release Laravel 13 needs" }
      - { file: composer.json, contains: '"phpunit/phpunit": "^11.5"', why: "a PHPUnit the framework supports" }
      - { file: composer.lock, matches: '"name": "laravel/framework",\s+"version": "v13\.', why: "Laravel 13 is what was installed and tested" }
      - { file: tests/Feature/OrdersTest.php, contains: "assertJsonPath('total', '58.50')", why: "the tests are the application's own, unchanged in what they check" }

  # Laravel 8: five major releases in one migration.
  - id: laravel-8-to-13
    path: shop-laravel8
    playbook: laravel-13
    checks:
      - { file: composer.lock, matches: '"name": "laravel/framework",\s+"version": "v13\.', why: "Laravel 13 is what was installed and tested" }
      - { file: composer.json, absent: "fruitcake/laravel-cors", why: "CORS handling is in the framework since Laravel 9" }
      - { file: composer.json, absent: "facade/ignition", why: "replaced by spatie/laravel-ignition" }
      - { file: app/Http/Kernel.php, contains: "Illuminate\\Http\\Middleware\\HandleCors", why: "the middleware is the framework's own" }
      - { file: app/Models/Order.php, absent: "$dates", why: "the property Laravel 10 removed is a cast now" }

  - id: laravel-10-to-12
    path: orders-laravel10
    playbook: laravel-12
    checks:
      - { file: composer.json, contains: '"laravel/framework": "^12.0"', why: "on the chosen target, not the newest" }
      - { file: composer.lock, matches: '"name": "laravel/framework",\s+"version": "v12\.', why: "Laravel 12 is what was installed and tested" }

  # The other PHP versions, and the add-on that goes on from PHPUnit 9 to 11. PHP 8.3 and 8.5 are verified on
  # those releases where they are installed, else on the next newer one (the report says which).
  - id: php74-library-to-83
    path: ledger-php74
    playbook: php-to-8.3
    checks:
      - { file: composer.json, contains: '"php": "^8.3"', why: "on the chosen target, not the newest" }

  - id: php74-library-to-85-phpunit11
    path: ledger-php74
    playbook: php-to-8.5+phpunit11
    checks:
      - { file: composer.json, contains: '"php": "^8.5"', why: "on the target" }
      - { file: composer.json, contains: '"phpunit/phpunit": "^11.5"', why: "the add-on's PHPUnit" }
      - { file: tests/AccountTest.php, contains: "expectException(\\RuntimeException::class)", why: "the test still checks for the exception" }

  - id: fastroute-13-to-84-phpunit11
    path: public/fastroute-1.3
    playbook: php-to-8.4+phpunit11
    checks:
      - { file: composer.json, contains: '"phpunit/phpunit": "^11.5"', why: "the add-on's PHPUnit" }
      - { file: "test/**/*Test.php", absent: "@dataProvider", why: "PHPUnit 12 no longer reads the annotation" }
      - { file: test/Dispatcher/DispatcherTest.php, contains: "#[\\PHPUnit\\Framework\\Attributes\\DataProvider(", why: "the tests still get their data" }

  - id: laravel-8-to-11
    path: shop-laravel8
    playbook: laravel-11
    checks:
      # Laravel 11 no longer gets security fixes, and Composer refuses its releases that have an advisory: where
      # the project allows development versions, as Laravel's older skeletons do, it installs the 11.x branch.
      - { file: composer.lock, matches: '"name": "laravel/framework",\s+"version": "v?11\.', why: "Laravel 11 is what was installed and tested" }
      - { file: composer.json, contains: '"php": "^8.3"', why: "the PHP this target runs on" }

  # Laravel 7, as applications were written before factory classes: closure factories with a state, the
  # factory() helper in tests, controllers named by string in the routes, the model outside app/Models.
  - id: laravel-7-to-13
    path: store-laravel7
    playbook: laravel-13
    checks:
      - { file: composer.lock, matches: '"name": "laravel/framework",\s+"version": "v13\.', why: "Laravel 13 is what was installed and tested" }
      - { file: database/factories/OrderFactory.php, contains: "namespace Database\\Factories;", why: "where Laravel looks for a model's factory" }
      - { file: database/factories/OrderFactory.php, contains: "public function bulk()", why: "the state is a method of the factory class" }
      - { file: app/Order.php, contains: "HasFactory", why: "the model can make its factory" }
      - { file: tests/Feature/OrdersTest.php, contains: "Order::factory()->bulk()->create(['customer' => 'Yaw'])", why: "the test makes the same records as before" }
      - { file: composer.json, absent: "fideloper/proxy", why: "trusted proxies are in the framework since Laravel 9" }

  # A site from before Composer and frameworks: pages in the folder, an include with each(), create_function(),
  # curly-brace offsets and reversed implode(). No tests; what shows it still works is the side-by-side run.
  - id: plain-site-to-84
    path: brochure-php-plain
    playbook: php-to-8.4
    checks:
      - { file: composer.json, contains: '"php": "^8.4"', why: "the site now says which PHP it runs on" }
      - { file: includes/catalogue.php, absent: "create_function", why: "removed in PHP 8" }
      - { file: includes/catalogue.php, absent: "each(", why: "removed in PHP 8" }
      - { file: index.php, contains: "implode(', ', array_keys($CATALOGUE))", why: "implode() takes the separator first" }
      - { file: index.php, contains: "<?php require 'includes/catalogue.php'; ?>", why: "the pages are still plain PHP pages" }

  # Symfony 5.4 as applications were written then: routes as annotations, @Method from
  # SensioFrameworkExtraBundle, doctrine/annotations, functional tests with WebTestCase.
  - id: symfony-54-to-74
    path: notes-symfony54
    playbook: symfony-7.4
    checks:
      - { file: composer.json, contains: '"symfony/framework-bundle": "7.4.*"', why: "on the target" }
      - { file: composer.json, matches: '"symfony":\s*\{[^}]*"require": "7\.4\.\*"', why: "Flex holds every Symfony package to the target" }
      - { file: composer.json, absent: "sensio/framework-extra-bundle", why: "the bundle ended with Symfony 6.4" }
      - { file: config/bundles.php, absent: "SensioFrameworkExtraBundle", why: "a bundle that is not installed cannot be registered" }
      - { file: src/Controller/NoteController.php, contains: "#[Route(path: '/notes/{number}', name: 'note_show', requirements: ['number' => '\\d+'], methods: ['GET'])]",
          why: "the route keeps its path, name, requirement and method, the last of which came from @Method" }
      - { file: src/Controller/NoteController.php, absent: "Sensio", why: "nothing of the removed bundle is left in the code" }
      - { file: config/routes/annotations.yaml, contains: "type: attribute", why: "routes are loaded from attributes" }

  - id: symfony-54-to-64
    path: notes-symfony54
    playbook: symfony-6.4
    checks:
      - { file: composer.json, contains: '"symfony/framework-bundle": "6.4.*"', why: "on the chosen target, not the newest" }
      - { file: composer.lock, matches: '"name": "symfony/framework-bundle",\s+"version": "v6\.4\.', why: "Symfony 6.4 is what was installed and tested" }

  # Symfony 8, which dropped annotations' classes and XML configuration altogether: Rector reads the code
  # against Symfony 7.4, and the application is installed and tested on 8.1.
  - id: symfony-54-to-81
    path: notes-symfony54
    playbook: symfony-8.1
    checks:
      - { file: composer.lock, matches: '"name": "symfony/framework-bundle",\s+"version": "v8\.1\.', why: "Symfony 8.1 is what was installed and tested" }
      - { file: src/Controller/NoteController.php, contains: "#[Route(path: '/notes', name: 'note_add', methods: ['POST'])]", why: "routes are attributes, which is all Symfony 8 reads" }
      - { file: config/routes/framework.yaml, contains: "routing/errors.php", why: "the framework's routes are no longer shipped as XML" }
      - { file: composer.json, absent: "composer.renova", why: "nothing of Renova's own is left in the project" }
