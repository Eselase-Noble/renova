# Renova targets suite: one app per migration path, each expected to pass with recipes, text rules and guards
# alone. It answers "does every target Renova offers work end to end?", without an AI key.
#
# Run: benchmark/fetch-public.sh                       (once: fetches the public project below)
#      cli/bin/renova benchmark --suite benchmark/targets.yaml --out <empty dir> --configs deterministic
#
# java-to-25 needs JDK 25 in JAVA_HOME and is left out; run it on its own with --playbook java-to-25.

id: java-targets
appsDir: ../../renova-test-apps

configurations:
  - id: deterministic           # recipes, text rules and guards only; free
    behaviour: false

apps:
  - id: java17-to-21
    path: billing-java17
    playbook: java-to-21
    checks:
      - { file: pom.xml, contains: "<maven.compiler.source>21</maven.compiler.source>", why: "the build compiles for the target" }
      - { file: src/main/java/com/acme/billing/Invoice.java, contains: "getFirst()", why: "code uses what the new Java level offers" }

  - id: java17-to-21-gradle
    path: billing-gradle17
    playbook: java-to-21
    checks:
      - { file: build.gradle, contains: "JavaVersion.VERSION_21", why: "the Gradle build compiles for the target" }
      - { file: build.gradle, absent: "openrewrite", why: "the build files are not given a migration plugin" }

  - id: spring-boot-2-to-3
    path: orders-boot2
    playbook: spring-boot-3
    checks:
      - { file: pom.xml, matches: '<artifactId>spring-boot-starter-parent</artifactId>\s*<version>3\.5\.', why: "on the target release, not part-way" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Spring Boot 3 is built on Jakarta EE" }
      - { file: src/main/java/com/acme/orders/SecurityConfig.java, contains: "SecurityFilterChain", why: "WebSecurityConfigurerAdapter was removed" }
      - { file: src/main/java/com/acme/orders/SecurityConfig.java, contains: "permitAll", why: "the access rules are kept" }

  - id: spring-boot-2-to-4
    path: orders-boot2
    playbook: spring-boot-4
    checks:
      - { file: pom.xml, matches: '<artifactId>spring-boot-starter-parent</artifactId>\s*<version>4\.1\.', why: "on the latest release" }
      - { file: pom.xml, contains: "spring-boot-starter-webmvc", why: "the web starter was renamed in Spring Boot 4" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Jakarta EE" }

  - id: spring5-to-7
    path: notes-spring5
    playbook: java-to-21-jakarta-ee11-spring7
    checks:
      - { file: pom.xml, matches: '<spring.version>7\.', why: "Spring Framework 7" }
      - { file: pom.xml, matches: '(?s)<artifactId>jakarta.servlet-api</artifactId>\s*<version>6\.1', why: "Spring 7 needs Servlet 6.1" }
      - { file: pom.xml, matches: '(?s)<artifactId>jakarta.servlet-api</artifactId>.*?<scope>provided</scope>', why: "the container supplies the Servlet API" }
      - { file: "**/*.java", absent: "import javax.servlet", why: "Jakarta EE" }

  # A real project nobody wrote for Renova: the Spring PetClinic sample at its last Spring Boot 2.7 commit.
  # The same project built with Gradle: its wrapper (7.5) does not start on Java 21, so the recipes run on an
  # older installed JDK (17 or earlier) and the result is built on the target's.
  - id: petclinic-gradle-boot-2-to-3
    path: public/petclinic-boot27-gradle
    playbook: spring-boot-3
    checks:
      - { file: build.gradle, matches: "id 'org.springframework.boot' version '3\\.5\\.", why: "on the target release" }
      - { file: build.gradle, contains: "jakarta.xml.bind:jakarta.xml.bind-api", why: "the JAXB API the code imports is declared" }
      - { file: build.gradle, absent: "javax.xml.bind", why: "no javax leftover" }
      - { file: build.gradle, absent: "openrewrite", why: "the build files are not given a migration plugin" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Jakarta EE" }

  - id: petclinic-boot-2-to-3
    path: public/petclinic-boot27
    playbook: spring-boot-3
    checks:
      - { file: pom.xml, matches: '<artifactId>spring-boot-starter-parent</artifactId>\s*<version>3\.5\.', why: "on the target release" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Jakarta EE" }
      - { file: "**/*.java", absent: "import javax.validation", why: "Jakarta EE" }

  # Six library add-ons on one project that also starts at the Java 6 source level.
  - id: legacy-libraries
    path: legacy-libs
    playbook: java-to-21+junit5+mockito5+log4j2+commons-lang3+commons-collections4+httpclient5
    checks:
      - { file: "**/*.java", absent: "import org.junit.Test", why: "JUnit 5" }
      - { file: "**/*.java", absent: "import org.apache.commons.lang.", why: "Commons Lang 3" }
      - { file: "**/*.java", absent: "import org.apache.commons.collections.", why: "Commons Collections 4" }
      - { file: "**/*.java", absent: "import org.apache.log4j.", why: "Log4j 2" }
      - { file: "**/*.java", absent: "import org.apache.http.", why: "HttpClient 5" }

  - id: hibernate-5-to-6
    path: stock-hibernate5
    playbook: java8-to-21-jakarta-ee10
    checks:
      - { file: pom.xml, matches: '(?s)<artifactId>hibernate-core</artifactId>\s*<version>6\.6\.', why: "Hibernate 6.6" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Jakarta EE" }

  - id: hibernate-5-to-7
    path: stock-hibernate5
    playbook: java-to-21-jakarta-ee11-spring7
    checks:
      - { file: pom.xml, matches: '(?s)<artifactId>hibernate-core</artifactId>\s*<version>7\.', why: "Hibernate 7" }
      - { file: "**/*.java", absent: "import javax.persistence", why: "Jakarta EE" }

  - id: gradle-multi-project
    path: warehouse-gradle
    playbook: java-to-21
    checks:
      - { file: "**/*.gradle", absent: "openrewrite", why: "the build files are not given a migration plugin" }

  # The recipes the Quarkus project publishes for each release, run in release order up to the target.
  - id: quarkus-2-to-3
    path: catalog-quarkus2
    playbook: quarkus-3
    checks:
      - { file: pom.xml, matches: '<quarkus.platform.version>3\.', why: "on Quarkus 3" }
      - { file: pom.xml, contains: "quarkus-rest-jackson", why: "the REST extensions were renamed in 3.9" }
      - { file: "**/*.java", absent: "import javax.ws.rs", why: "Jakarta REST" }
      - { file: "**/*.java", absent: "import javax.enterprise", why: "Jakarta CDI" }

  - id: micronaut-3-to-4
    path: greeter-micronaut3
    playbook: micronaut-4
    checks:
      - { file: pom.xml, matches: '(?s)<groupId>io.micronaut.platform</groupId>\s*<artifactId>micronaut-parent</artifactId>\s*<version>4\.', why: "the Micronaut 4 platform parent" }
      - { file: pom.xml, contains: "micronaut-validation-processor", why: "without the processor, invalid requests are accepted silently" }
      - { file: "**/*.java", absent: "import javax.validation", why: "Jakarta" }

  # No Maven or Gradle build: an Ant web application with its libraries as jar files. Renova gives the copy a
  # Maven build in the standard layout, then migrates it like any other project. (Identifying the jars asks
  # Maven Central; offline they stay files and are not upgraded.)
  - id: ant-to-maven-jakarta
    path: payroll-ant
    playbook: java8-to-21-jakarta-ee10
    checks:
      - { file: pom.xml, contains: "<packaging>war</packaging>", why: "a Maven build was generated" }
      - { file: pom.xml, contains: "renova-libs", why: "a library nobody published is kept, as a file" }
      - { file: src/main/java/com/acme/payroll/PayslipServlet.java, contains: "import jakarta.servlet", why: "Jakarta EE" }
      - { file: src/test/java/com/acme/payroll/PayslipTest.java, contains: "class PayslipTest", why: "tests are in the standard place, and run" }
      - { file: src/main/resources/com/acme/payroll/labels.properties, contains: "net=", why: "resources beside the sources still reach the classpath" }

  # A change of platform: off the application server (JBoss descriptors, EJB, CDI, JAX-RS, JPA) and onto
  # Spring Boot. The generated test starts the whole application on an in-memory database.
  - id: jakarta-ee-to-spring-boot
    path: ledger-javaee
    playbook: jakarta-ee-to-spring-boot
    checks:
      - { file: pom.xml, contains: "spring-boot-starter-jersey", why: "REST resources keep JAX-RS and run on Jersey" }
      - { file: pom.xml, absent: "javaee-api", why: "no server supplies the platform API any more" }
      - { file: pom.xml, contains: "<packaging>jar</packaging>", why: "it runs on its own" }
      - { file: src/main/java/com/acme/ledger/service/AccountService.java, matches: '@Service\s+@Transactional', why: "a session bean's methods ran in a transaction" }
      - { file: src/main/java/com/acme/ledger/service/AccountService.java, absent: "unitName", why: "Spring Boot's persistence unit is not the one persistence.xml named" }
      - { file: src/main/java/com/acme/ledger/api/LedgerApplication.java, contains: "register(com.acme.ledger.api.AccountResource.class)", why: "a resource Jersey does not know is not served" }
      - { file: src/main/resources/application.properties, contains: "server.servlet.context-path=/ledger", why: "the application answers at the address the server gave it" }
      - { file: "**/*.java", absent: "import jakarta.ejb", why: "no EJB container" }

  # Both at once: an Ant web application ends as a Spring Boot WAR, with its JUnit 4 tests still running.
  - id: ant-to-spring-boot
    path: payroll-ant
    playbook: jakarta-ee-to-spring-boot
    checks:
      - { file: pom.xml, contains: "junit-vintage-engine", why: "the application's JUnit 4 tests run beside the new JUnit 5 one" }
      - { file: pom.xml, contains: "<packaging>war</packaging>", why: "it has pages, so it stays a WAR that also runs on its own" }
      - { file: src/main/java/com/acme/payroll/WebConfiguration.java, contains: 'new com.acme.payroll.PayslipServlet(), "/payslip"', why: "an embedded server does not read web.xml: its servlets are declared in code" }
      - { file: src/main/resources/application.properties, contains: "server.servlet.context-path=/payroll", why: "the same address as on the server" }

  # Struts 2 → 7 with the Jakarta target. The recipe renames the Aware setters in the action; a guard renames
  # the calls to them in the test that sets the action up by hand.
  - id: struts-2-to-7
    path: helpdesk-struts2
    playbook: java8-to-21-jakarta-ee10+struts7
    checks:
      - { file: pom.xml, matches: '(?s)<artifactId>struts2-core</artifactId>\s*<version>7\.', why: "Struts 7, the first line on Jakarta EE" }
      - { file: src/main/java/com/acme/helpdesk/TicketAction.java, contains: "org.apache.struts2.action.SessionAware", why: "the interface Struts 7 has" }
      - { file: src/test/java/com/acme/helpdesk/TicketActionTest.java, contains: "action.withSession(session)", why: "callers follow the renamed setter" }
