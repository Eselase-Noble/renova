# The project file itself: the format the dotnet tools build, and what a test project needs for its tests to
# be found. Shared by every .NET target.

rules:

  - id: sdk-style-project
    title: Convert the project file to the SDK style
    category: A
    severity: BLOCKER
    detect: { type: legacyProjectFormat, exceptKinds: [aspnet, webforms] }
    fix:
      strategy: dotnet
      params:
        action: convertToSdkStyle
        # Libraries old projects kept as files beside the code, or took from Visual Studio: NuGet has them.
        assemblies:
          - { assembly: nunit.framework, package: "NUnit:3.14.0, NUnit3TestAdapter:5.2.0" }
          - { assembly: xunit, package: "xunit:2.9.3, xunit.runner.visualstudio:3.1.5" }
          - { assembly: Newtonsoft.Json, package: "Newtonsoft.Json:13.0.4" }
          - { assembly: log4net, package: "log4net:3.5.0" }
          - { assembly: Moq, package: "Moq:4.20.72" }
    rationale: >
      Modern .NET builds only SDK-style projects. The old format lists every source file and framework
      assembly and keeps NuGet packages in packages.config; the SDK style finds sources by pattern, gets the
      framework from the target, and names packages in the project file. Renova writes out whatever the old
      file said that the new format would not assume, so the same files are compiled as before.

  - id: aspnet-mvc
    title: ASP.NET MVC 5 and Web API 2 to ASP.NET Core
    category: C
    severity: BLOCKER
    detect:
      type: projectKind
      kinds: [aspnet]
      files: ["**/*.cs", "**/*.vb", "**/*.cshtml", "**/*.vbhtml", "Web.config", "Web.*.config", "Views/Web.config",
              "Global.asax", "packages.config", "**/*.asax"]
    fix:
      strategy: ai
      hint: >
        This project is built on System.Web, which modern .NET does not have. Move the whole project to
        ASP.NET Core on the goal's .NET version, keeping every URL, view and behaviour.
        Project file: rewrite it as <Project Sdk="Microsoft.NET.Sdk.Web"> with <TargetFramework>netN.0</TargetFramework>
        (N from the goal), the RootNamespace and AssemblyName it had, its ProjectReference items, and only the
        NuGet packages the code still uses in versions that support that .NET (Microsoft.AspNet.*, Microsoft.Web.*,
        Microsoft.CodeDom.*, WebGrease, Antlr, bundling and jQuery packages go: ASP.NET Core is part of the SDK).
        Do not list source files. Remove packages.config, Global.asax, Global.asax.cs, App_Start files,
        Properties/AssemblyInfo.cs, Web.config, Web.Debug.config, Web.Release.config and Views/Web.config through
        "deletes". Start-up: add Program.cs with WebApplication.CreateBuilder, AddControllersWithViews(), static
        files, routing, and the routes RouteConfig and WebApiConfig registered, in the same order
        (MapControllerRoute with the same template and defaults); filters from FilterConfig become
        options.Filters; what Application_Start set up becomes service registrations. End Program.cs with
        "public partial class Program { }" so tests can start the application. Controllers: System.Web.Mvc.Controller
        becomes Microsoft.AspNetCore.Mvc.Controller, ActionResult stays, HttpNotFound() is NotFound(),
        new HttpStatusCodeResult(n) is StatusCode(n), [HttpPost], [ValidateAntiForgeryToken] and model binding
        stay, Json(x, JsonRequestBehavior.AllowGet) is Json(x), Server.MapPath uses IWebHostEnvironment,
        HttpContext.Current becomes the controller's HttpContext or an injected IHttpContextAccessor, Session
        needs AddSession and UseSession, Request.QueryString["x"] is Request.Query["x"], Request.Url is built from
        Request.Scheme, Host and Path. Web API 2: ApiController becomes ControllerBase with [ApiController] and
        the same route attributes; IHttpActionResult becomes IActionResult; Ok(), NotFound() and BadRequest() stay.
        Dependencies a controller created itself or took from a static stay as they are unless a container was
        configured. Views: keep the .cshtml files and their paths; add Views/_ViewImports.cshtml with
        @addTagHelper *, Microsoft.AspNetCore.Mvc.TagHelpers and the @using lines Views/Web.config gave every view;
        @Html.ActionLink, @Html.BeginForm, @Html.EditorFor, @Html.ValidationMessageFor, @Html.Partial and
        @Html.AntiForgeryToken work unchanged; @Scripts.Render and @Styles.Render become plain script and link
        tags for the files the bundle listed; @helper blocks become partial views or local functions;
        HttpContext.Current in a view becomes Context. Static files (Content, Scripts, images, fonts) are served
        from wwwroot: they cannot be moved here, so serve the existing folders with app.UseStaticFiles and a
        PhysicalFileProvider for each at its old request path. Configuration: appSettings and connectionStrings
        from Web.config become appsettings.json ("AppSettings" section and "ConnectionStrings"), read through
        IConfiguration; code that calls ConfigurationManager.AppSettings directly may keep doing so only if the
        values are also given in an App.config, so prefer IConfiguration. Authentication and authorization
        settings, HTTP modules and handlers from Web.config have no file to go to: say in the rationale which
        ones there were and that they need a person.
      # The project is replaced as one change: its code, views and configuration together, with the files
      # ASP.NET Core needs added and the ones only System.Web read removed.
      params:
        together: true
        create: ["**/*.cs", "**/*.cshtml", "**/appsettings*.json", "**/Properties/launchSettings.json"]
    rationale: >
      MVC 5 and Web API 2 map closely onto ASP.NET Core MVC: controllers, actions, model binding, Razor views
      and routing are the same ideas under new namespaces. What has no counterpart is the hosting: Global.asax,
      Web.config, bundles and the System.Web pipeline.

  - id: wcf-service-application
    title: WCF services hosted by IIS are hosted with CoreWCF
    category: C
    severity: BLOCKER
    detect: { type: projectKind, kinds: [wcf] }
    fix:
      strategy: corewcf
      params: { version: "1.8.0" }
    rationale: >
      Modern .NET has the WCF client and not the server. CoreWCF hosts the same service contracts on ASP.NET
      Core: the contracts and service classes keep their code under the CoreWCF namespace, Program.cs
      registers each service with the endpoints Web.config declared (or, where it declared none, the
      basicHttpBinding endpoint IIS gave it) at the address of its .svc file, and the WSDL is published as
      before. Bindings other than basicHttpBinding, wsHttpBinding and webHttpBinding, and security,
      throttling and quota settings from the configuration, are named in the report for a person. A Visual
      Basic service project is left as it is.

  - id: aspnet-web-forms
    title: ASP.NET Web Forms has no modern .NET release
    category: C
    severity: BLOCKER
    detect: { type: projectKind, kinds: [webforms] }
    fix:
      strategy: manual
      hint: >
        Web Forms pages (.aspx, .ascx, .master) with code behind, view state and server controls have no
        counterpart in ASP.NET Core, and the project is left as it is. Pages are rewritten as Razor Pages or
        Blazor components, one at a time: keep the old application running and put a proxy (YARP) in front, so
        each rewritten page takes over its URL. Class libraries the web project uses are migrated by the other
        rules and can serve both applications meanwhile.

  - id: guard-windows-reference
    phase: guard
    title: A project that uses a Windows desktop project must target Windows too
    category: A
    severity: BLOCKER
    detect: { type: referencesWindowsProject }
    fix:
      strategy: dotnet
      params: { action: targetWindows }
    rationale: >
      A Windows Forms or WPF project targets netN.0-windows, and NuGet refuses a reference to it from a
      project that targets plain netN.0 (NU1201). The tests of a desktop application are the usual case.

  - id: guard-test-sdk
    phase: guard
    title: A test project needs Microsoft.NET.Test.Sdk
    category: E
    severity: BLOCKER
    detect:
      type: nugetPackage
      ids: [NUnit, xunit, MSTest.TestFramework]
      unless: [Microsoft.NET.Test.Sdk, MSTest]
    fix:
      strategy: dotnet
      params: { action: addPackage, packages: ["Microsoft.NET.Test.Sdk:18.10.1"] }
    rationale: >
      dotnet test finds tests through this package. Projects from the old format never had it, because Visual
      Studio ran their tests itself: without it the build passes and no test runs.

  - id: guard-mstest-packages
    phase: guard
    title: MSTest comes from NuGet packages now
    category: E
    severity: BLOCKER
    detect:
      type: namespaceWithoutPackage
      prefixes: [Microsoft.VisualStudio.TestTools.UnitTesting]
      packages: [MSTest.TestFramework, MSTest]
    fix:
      strategy: dotnet
      params: { action: addPackage, packages: ["MSTest.TestFramework:3.11.1", "MSTest.TestAdapter:3.11.1", "Microsoft.NET.Test.Sdk:18.10.1"] }
    rationale: >
      Old test projects referenced Microsoft.VisualStudio.QualityTools.UnitTestFramework, an assembly installed
      with Visual Studio. The same attributes and assertions, in the same namespace, are in MSTest.TestFramework.

  - id: guard-mstest-adapter
    phase: guard
    title: MSTest tests are found by MSTest.TestAdapter
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [MSTest.TestFramework], unless: [MSTest.TestAdapter, MSTest] }
    fix:
      strategy: dotnet
      params: { action: addPackage, packages: ["MSTest.TestAdapter:3.11.1"] }

  - id: guard-nunit-adapter
    phase: guard
    title: NUnit tests are found by NUnit3TestAdapter
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [NUnit], unless: [NUnit3TestAdapter] }
    fix:
      strategy: dotnet
      params: { action: addPackage, packages: ["NUnit3TestAdapter:5.2.0"] }

  - id: guard-xunit-runner
    phase: guard
    title: xUnit tests are found by xunit.runner.visualstudio
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [xunit], unless: [xunit.runner.visualstudio] }
    fix:
      strategy: dotnet
      params: { action: addPackage, packages: ["xunit.runner.visualstudio:3.1.5"] }

  - id: mstest-3
    title: MSTest 1 and 2 do not run on modern .NET's current releases
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [MSTest.TestFramework, MSTest.TestAdapter], versionBelow: "3.0" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "3.11.1" }

  - id: nunit-3
    title: NUnit and its adapter must be releases that know modern .NET
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [NUnit], versionBelow: "3.14" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "3.14.0" }
    rationale: >
      3.14 is the last NUnit 3 and runs on every modern .NET. Tests written for NUnit 2 use names NUnit 3
      removed (TestFixtureSetUp is OneTimeSetUp, ExpectedException is Assert.Throws): they stop compiling, and
      a person or the AI repair has to rename them.

  - id: nunit-2-tests
    title: Tests written for NUnit 2
    category: C
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.cs", "**/*.vb"]
      pattern: "ExpectedException\\s*\\(|\\bTestFixtureSetUp\\b|\\bTestFixtureTearDown\\b|Assert\\.Is(Not)?NullOrEmpty|\\[Ignore(\\(\\s*\\))?\\]"
      requires: "NUnit\\.Framework"
    fix:
      strategy: dotnet-source
      params: { action: nunit3 }
    rationale: >
      NUnit 2 does not run on modern .NET, and NUnit 3 removed some of what it had. [ExpectedException(typeof(X))]
      becomes Assert.Throws<X> around the test's body, which checks the same thing: that exception, of exactly
      that type. TestFixtureSetUp and TestFixtureTearDown were renamed. An ExpectedException that also matches
      a message is left as it is and stops the build, so that a person decides how to check the message.

  - id: nunit-adapter
    title: The NUnit test adapter must know modern .NET
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [NUnit3TestAdapter], versionBelow: "4.5" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "5.2.0" }

  - id: nunit-2-adapter
    title: The NUnit 2 adapter does not run NUnit 3 tests
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [NUnitTestAdapter] }
    fix:
      strategy: dotnet
      params: { action: replacePackage, packages: ["NUnit3TestAdapter:5.2.0"] }

  - id: xunit-2-9
    title: xUnit and its runner must be releases that know modern .NET
    category: E
    severity: WARNING
    detect: { type: nugetPackage, ids: [xunit], versionBelow: "2.9" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "2.9.3" }

  - id: xunit-runner
    title: The xUnit runner must know modern .NET
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [xunit.runner.visualstudio], versionBelow: "2.8" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "3.1.5" }

  - id: test-sdk
    title: Microsoft.NET.Test.Sdk must know the target framework
    category: E
    severity: BLOCKER
    detect: { type: nugetPackage, ids: [Microsoft.NET.Test.Sdk], versionBelow: "17.8" }
    fix:
      strategy: dotnet
      params: { action: setPackageVersion, version: "18.10.1" }

knowledge:

  - id: dotnet-project-format
    title: SDK-style projects
    triggers: ["csproj", "vbproj", "PackageReference", "packages.config", "TargetFramework", "NU1", "MSB", "CS0246", "CS0234", "BC30002"]
    body: |
      An SDK-style project (<Project Sdk="Microsoft.NET.Sdk">) compiles every .cs or .vb file under its folder,
      so a file is taken out with <Compile Remove="..." />, not by leaving it unlisted. NuGet packages are
      <PackageReference Include="Id" Version="x" /> items; there is no packages.config and no HintPath into a
      packages folder. Framework assemblies are not referenced one by one: what .NET Framework had built in and
      modern .NET does not is a package (System.Configuration.ConfigurationManager, System.Data.SqlClient or
      Microsoft.Data.SqlClient, System.Drawing.Common, System.ServiceModel.Primitives and .Http for WCF
      clients, System.Runtime.Caching, System.DirectoryServices, System.Management). "The type or namespace
      name X could not be found" (CS0246, CS0234, or BC30002 in Visual Basic) after a migration usually means
      such a package is missing from the project file: add it there and leave the code alone. A project with
      its own AssemblyInfo file sets <GenerateAssemblyInfo>false</GenerateAssemblyInfo>, or the attributes are
      defined twice (CS0579). Windows Forms and WPF projects target netN.0-windows with
      <UseWindowsForms>true</UseWindowsForms> or <UseWPF>true</UseWPF>.
