# Add-on: Struts 2 → 7, combined with a Jakarta target as in java8-to-21-jakarta-ee10+struts7. Renova adds it
# by itself when it suggests a target for a project that uses Struts.

id: struts7
name: "Struts 2 → 7"
ecosystem: java
version: 0.1.0
description: >
  Moves a Struts 2 application to Struts 7, the first Struts line on Jakarta EE: renamed packages, the Aware
  interfaces, struts.xml. For use with a Jakarta target; Struts 7 does not run on javax.servlet.

settings:
  kind: addon
  openrewrite:
    artifacts:
      - org.openrewrite.recipe:rewrite-struts:0.27.0

rules:

  - id: struts-7
    title: Upgrade Struts 2 to Struts 7 (the Jakarta EE line)
    category: C
    severity: BLOCKER
    detect:
      type: dependency
      coordinates: ["org.apache.struts:struts2-*"]
      versionBelow: "7"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.struts.migrate6.MigrateStruts6, org.openrewrite.java.struts.migrate7.MigrateStruts7]
    rationale: >
      Struts 2.x and 6.x run on javax.servlet only; Struts 7 is the first line on Jakarta EE. The recipes rename
      the com.opensymphony.xwork2 classes to org.apache.struts2, replace the removed Aware interfaces
      (SessionAware.setSession is withSession, and so on, in the actions and in the code that calls them) and
      update struts.xml constants and DTDs. Plugins without a Struts 7
      release, and OGNL expressions that relied on relaxed security defaults, need a person.

  - id: guard-struts-aware-callers
    phase: guard
    title: Calls to the Aware setters Struts 7 renamed
    category: C
    severity: BLOCKER
    detect:
      type: renamedMethodCallers
      renames:
        setSession: withSession
        setApplication: withApplication
        setRequest: withRequest
        setParameters: withParameters
        setServletRequest: withServletRequest
        setServletResponse: withServletResponse
        setServletContext: withServletContext
        setPrincipalProxy: withPrincipalProxy
        setCookiesMap: withCookies
    fix:
      strategy: renameCalls
    rationale: >
      The upgrade recipe renames the setters where an action implements them. Code that calls them on an
      action, most often a unit test that sets the action up by hand, is left calling a method that no longer
      exists. Only calls on a variable of such an action class are renamed: a mock request's setSession is not.
