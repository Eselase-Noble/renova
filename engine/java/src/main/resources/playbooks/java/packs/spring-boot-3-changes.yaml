# Rule pack: what changes in an application's own code and configuration between Spring Boot 2 and 3.
# Included by the playbooks in the folder above; a pack holds only rules and knowledge cards.
#
# Spring Boot manages dependency versions and runs its own embedded server, so Spring Boot playbooks do not
# include the Jakarta pack's guards for WAR deployments (provided scopes, explicitly declared APIs): they would
# fight the starters. The javax to jakarta rename itself is part of the Spring Boot recipe.

rules:

  - id: javax-ee-imports
    title: Rename javax.* Java EE packages to jakarta.*
    category: B
    severity: BLOCKER
    detect:
      type: import
      prefixes:
        - javax.servlet
        - javax.annotation
        - javax.persistence
        - javax.validation
        - javax.xml.bind
        - javax.ws.rs
        - javax.inject
        - javax.jms
        - javax.mail
        - javax.websocket
        - javax.transaction
        - javax.activation
        - javax.json
      exclude:
        # Still in the JDK, or not Java EE at all (JSR-305).
        - javax.annotation.processing
        - javax.annotation.Nonnull
        - javax.annotation.Nullable
        - javax.annotation.CheckForNull
        - javax.annotation.concurrent
        - javax.annotation.meta
        - javax.transaction.xa
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5]
    rationale: Spring Boot 3 is built on Jakarta EE 10; the starters no longer bring the javax APIs.

  - id: spring-security-configurer-adapter
    title: Replace WebSecurityConfigurerAdapter (removed in Spring Security 6)
    category: C
    severity: BLOCKER
    detect:
      type: import
      prefixes: [org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter]
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5]
    rationale: >
      Security configuration becomes SecurityFilterChain beans, and antMatchers becomes requestMatchers. The
      recipe converts the common shapes; the build and the tests show what it could not.

  - id: spring-boot-renamed-properties
    title: Rename configuration properties that changed in Spring Boot 3
    category: C
    severity: WARNING
    detect:
      type: fileContains
      include: ["**/application*.properties", "**/application*.yml", "**/application*.yaml"]
      pattern: "spring\\.(redis|data\\.cassandra|jpa\\.hibernate\\.use-new-id-generator-mappings|mvc\\.pathmatch|security\\.saml2\\.relyingparty\\.registration\\.[^.]+\\.identityprovider)|management\\.metrics\\.export|server\\.max-http-header-size"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5]

  - id: spring-factories-autoconfiguration
    title: Move auto-configuration registrations out of spring.factories
    category: C
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/META-INF/spring.factories"]
      pattern: "org\\.springframework\\.boot\\.autoconfigure\\.EnableAutoConfiguration"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.boot3.UpgradeSpringBoot_3_5]
    rationale: >
      Spring Boot 3 reads auto-configurations only from
      META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports.

  - id: spring-boot-trailing-slash
    title: URLs with a trailing slash no longer match
    category: D
    severity: WARNING
    detect:
      type: dependency
      coordinates: ["org.springframework.boot:spring-boot-starter-web", "org.springframework.boot:spring-boot-starter-webflux"]
    fix:
      strategy: manual
      hint: >
        Spring Boot 3 turned trailing-slash matching off: "/orders/" no longer answers where "/orders" is
        mapped, and callers get 404. Either add the trailing-slash forms explicitly where clients use them, or
        redirect them in one place with a filter. Check links, API clients and monitoring probes.

  - id: guard-boot-javax-api-dependencies
    phase: guard
    title: javax API dependencies Spring Boot 3 no longer manages
    category: E
    severity: BLOCKER
    detect:
      type: dependency
      coordinates:
        - "javax.validation:validation-api"
        - "javax.servlet:javax.servlet-api"
        - "javax.persistence:javax.persistence-api"
        - "javax.annotation:javax.annotation-api"
        - "javax.transaction:javax.transaction-api"
        - "javax.xml.bind:jaxb-api"
        - "javax.websocket:javax.websocket-api"
        - "javax.ws.rs:javax.ws.rs-api"
        - "javax.inject:javax.inject"
        - "javax.mail:javax.mail-api"
        - "javax.json:javax.json-api"
    fix:
      strategy: maven
      params:
        action: replaceManaged
        replacements:
          "javax.validation:validation-api": "jakarta.validation:jakarta.validation-api"
          "javax.servlet:javax.servlet-api": "jakarta.servlet:jakarta.servlet-api"
          "javax.persistence:javax.persistence-api": "jakarta.persistence:jakarta.persistence-api"
          "javax.annotation:javax.annotation-api": "jakarta.annotation:jakarta.annotation-api"
          "javax.transaction:javax.transaction-api": "jakarta.transaction:jakarta.transaction-api"
          "javax.xml.bind:jaxb-api": "jakarta.xml.bind:jakarta.xml.bind-api"
          "javax.websocket:javax.websocket-api": "jakarta.websocket:jakarta.websocket-api"
          "javax.ws.rs:javax.ws.rs-api": "jakarta.ws.rs:jakarta.ws.rs-api"
          "javax.inject:javax.inject": "jakarta.inject:jakarta.inject-api"
          "javax.mail:javax.mail-api": "jakarta.mail:jakarta.mail-api"
          "javax.json:javax.json-api": "jakarta.json:jakarta.json-api"
    rationale: >
      Spring Boot 2 managed the versions of the javax APIs; Spring Boot 3 manages their jakarta successors
      only. A javax dependency declared without a version, where the code that used it has already moved to
      jakarta, stops the build with "version is missing". Each becomes its successor, whose version Spring
      Boot manages.

  - id: guard-boot-managed-version-overrides
    phase: guard
    title: Version properties that pin what Spring Boot manages
    category: E
    severity: BLOCKER
    detect:
      type: pomProperty
      whenParent: "org.springframework.boot:spring-boot-starter-parent"
      overrides: [assertj.version, mockito.version, junit-jupiter.version, junit.version, hamcrest.version, byte-buddy.version,
                  hibernate.version, hibernate-validator.version, jackson-bom.version, jackson.version, lombok.version,
                  h2.version, mysql.version, postgresql.version, hikaricp.version, slf4j.version, logback.version,
                  log4j2.version, snakeyaml.version, tomcat.version, jetty.version, undertow.version, netty.version,
                  reactor-bom.version, micrometer.version, flyway.version, liquibase.version, thymeleaf.version,
                  spring-framework.version, spring-security.version, spring-data-bom.version, spring-kafka.version,
                  spring-amqp.version, spring-batch.version, spring-integration.version, spring-session-bom.version,
                  kafka.version, elasticsearch.version, mongodb.version, lettuce.version, jedis.version, groovy.version,
                  gson.version, json-path.version, glassfish-jaxb.version, selenium.version, rest-assured.version,
                  caffeine.version, ehcache3.version, jooq.version, awaitility.version, servlet-api.version]
    fix:
      strategy: maven
      params: { action: removeProperty }
    rationale: >
      A property such as assertj.version overrides the version Spring Boot's parent would choose. One set for
      Spring Boot 2 names a release from that time, which the libraries of Spring Boot 3 do not work with, and
      sometimes one whose bill of materials does not exist ("Non-resolvable import POM"). Without the
      property, Spring Boot's own version applies. Pin it again, to a current release, only if you must.

  - id: guard-boot-jaxb-api
    phase: guard
    title: Code that imports jakarta.xml.bind needs the JAXB API declared
    category: E
    severity: BLOCKER
    detect:
      type: importWithoutDependency
      provides:
        - { package: jakarta.xml.bind, dependency: "jakarta.xml.bind:jakarta.xml.bind-api:${jakarta-xml-bind.version}" }
    fix:
      strategy: maven
      params: { action: addDependency }
    rationale: >
      With Spring Boot 2 the javax.xml.bind API came along with other libraries. Their Spring Boot 3 versions
      no longer bring the jakarta one, so code that uses JAXB annotations stops compiling with "package
      jakarta.xml.bind.annotation does not exist". Spring Boot manages the version.

  - id: guard-gradle-jaxb-api
    phase: guard
    title: A Gradle build must declare the Jakarta XML Binding API the code imports
    category: E
    severity: BLOCKER
    detect:
      type: gradleImportWithoutDependency
      imports: [jakarta.xml.bind]
      dependency: "jakarta.xml.bind:jakarta.xml.bind-api"
      configuration: implementation
    fix:
      strategy: gradle
      # The recipe adds the old javax artifact at runtime only, which the renamed imports do not compile against.
      params: { action: addDependency, remove: ["javax.xml.bind:jaxb-api"] }
    rationale: >
      Spring Boot 2 brought javax.xml.bind in with its starters; Spring Boot 3 does not bring jakarta.xml.bind.
      Code that uses JAXB annotations needs the API declared. Spring Boot manages its version.

knowledge:

  - id: spring-boot-3-baseline
    title: What Spring Boot 3 requires
    triggers: ["spring-boot", "SpringBootApplication", "spring-boot-starter"]
    body: |
      Spring Boot 3 requires Java 17 or later, Spring Framework 6 and Jakarta EE 10: every javax.servlet,
      javax.persistence, javax.validation, javax.annotation (PostConstruct, PreDestroy, Resource) and
      javax.transaction import becomes jakarta.*. javax.sql, javax.crypto, javax.net and javax.naming stay:
      they are part of the JDK. Hibernate is 6.x: org.hibernate.dialect names for specific versions
      (MySQL8Dialect, PostgreSQL10Dialect) are gone, use the unversioned dialect or none. The starters manage
      the jakarta API versions; do not add them with explicit versions.

  - id: spring-security-6-configuration
    title: Spring Security 6 configuration
    triggers: ["WebSecurityConfigurerAdapter", "antMatchers", "authorizeRequests", "SecurityFilterChain"]
    body: |
      WebSecurityConfigurerAdapter was removed. Declare a @Bean SecurityFilterChain that takes HttpSecurity
      and returns http.build(). authorizeRequests() becomes authorizeHttpRequests(), and antMatchers(),
      mvcMatchers() and regexMatchers() become requestMatchers(). An AuthenticationManager comes from
      AuthenticationConfiguration.getAuthenticationManager(), not from overriding authenticationManagerBean().
      @EnableGlobalMethodSecurity becomes @EnableMethodSecurity. Keep the same rules in the same order, so
      access decisions do not change.
