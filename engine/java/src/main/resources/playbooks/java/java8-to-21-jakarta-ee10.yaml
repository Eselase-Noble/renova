# Java 8 / Java EE (javax) web applications → Java 21, Jakarta EE 10, Spring 6.
#
# Rules are data: detectors find work, fix strategies say who does it.
#   recipe  – deterministic OpenRewrite recipe (AST-aware, type-attributed)
#   replace – deterministic text replacement for files no parser handles (JSP, TLD)
#   ai      – context-dependent edit, proposed by the AI provider and checked by the build
#   manual  – reported for a person, with guidance
#
# Categories: A build/descriptors, B namespace renames, C API changes, D runtime behaviour, E dependencies.

id: java8-to-21-jakarta-ee10
name: "Java 8 → Java 21 + Jakarta EE 10 + Spring 6"
ecosystem: java
version: 0.1.0
description: >
  Moves a Java 8 / Java EE 8 (javax) web application to Java 21 and Jakarta EE 10, ready for
  Tomcat 10.1/11 and WildFly 27+ / JBoss EAP 8. Covers build, namespace, Spring 6 API and
  servlet-container behaviour changes.
targets:
  java: "21"
  jakartaEE: "10 (Servlet 6.0)"
  spring: "6.2"
  containers: "Tomcat 10.1/11, WildFly 27+ / JBoss EAP 8"

settings:
  openrewrite:
    plugin: org.openrewrite.maven:rewrite-maven-plugin:6.46.1
    artifacts:
      - org.openrewrite.recipe:rewrite-migrate-java:3.42.1
      - org.openrewrite.recipe:rewrite-spring:6.37.1
  # Behavioural verification (--verify-behaviour): where the original and the migrated app run side by side.
  behaviour:
    baseline: { build: "maven:3.9-eclipse-temurin-8", server: "tomcat:9.0-jdk8", platform: "Java 8, Tomcat 9" }
    candidate: { server: "tomcat:10.1-jdk21", platform: "Java 21, Tomcat 10.1" }

rules:

  # ---------------------------------------------------------------- A: build and descriptors

  - id: java-level
    title: Raise the Java language level to 21
    category: A
    severity: BLOCKER
    detect: { type: javaVersionBelow, version: 21 }
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.migrate.UpgradeToJava21]
    rationale: The build must compile for the target JDK; the recipe also replaces APIs removed between 8 and 21.

  - id: javax-ee-dependencies
    title: Replace javax Java EE dependencies with Jakarta EE 10
    category: A
    severity: BLOCKER
    detect:
      type: dependency
      coordinates:
        - "javax.servlet:*"
        - "javax.servlet.jsp:*"
        - "javax.servlet.jsp.jstl:*"
        - "jstl:jstl"
        - "javax.annotation:javax.annotation-api"
        - "javax.xml.bind:*"
        - "javax.xml.ws:*"
        - "javax.persistence:*"
        - "javax.validation:*"
        - "javax.ws.rs:*"
        - "javax.mail:*"
        - "javax.inject:*"
        - "javax.el:*"
        - "javax.activation:*"
        - "javax:javaee-api"
        - "javax:javaee-web-api"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.migrate.jakarta.JakartaEE10]

  - id: web-xml-schema
    title: Update web.xml to the Jakarta EE 10 / Servlet 6.0 schema
    category: A
    severity: WARNING
    detect:
      type: fileContains
      include: ["**/WEB-INF/web.xml"]
      pattern: "java\\.sun\\.com/(xml/ns|dtd)|xmlns\\.jcp\\.org/xml/ns"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.migrate.jakarta.JakartaWebXml6]

  - id: maven-variant-poms
    title: Bring alternative build files (e.g. pom.jboss.xml) in line with the migrated pom.xml
    category: A
    severity: WARNING
    detect: { type: fileExists, include: ["**/pom.*.xml"] }
    fix:
      strategy: ai
      hint: >
        Regenerate the variant from the migrated pom.xml and re-apply only its intended differences
        (e.g. logging backend, container-specific resources). Compare the two files afterwards to
        confirm no other differences exist.

  # ---------------------------------------------------------------- B: namespace renames

  - id: javax-ee-imports
    title: Rename javax.* Java EE packages to jakarta.*
    category: B
    severity: BLOCKER
    detect:
      type: import
      prefixes:
        - javax.servlet
        - javax.annotation
        - javax.persistence
        - javax.xml.bind
        - javax.xml.ws
        - javax.xml.soap
        - javax.ws.rs
        - javax.validation
        - javax.ejb
        - javax.inject
        - javax.enterprise
        - javax.interceptor
        - javax.jms
        - javax.mail
        - javax.faces
        - javax.el
        - javax.websocket
        - javax.transaction
        - javax.activation
        - javax.json
      exclude:
        # Still in the JDK, or not Java EE at all (JSR-305).
        - javax.annotation.processing
        - javax.annotation.Nonnull
        - javax.annotation.Nullable
        - javax.annotation.CheckForNull
        - javax.annotation.CheckReturnValue
        - javax.annotation.ParametersAreNonnullByDefault
        - javax.annotation.concurrent
        - javax.annotation.meta
        - javax.transaction.xa
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.migrate.jakarta.JakartaEE10]

  - id: javax-in-jsp
    title: Rename javax.servlet references in JSP pages and tag files
    category: B
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.jsp", "**/*.jspf", "**/*.tag", "**/*.tagx"]
      pattern: "javax\\.servlet"
    fix:
      strategy: replace
      include: "**/*.{jsp,jspf,tag,tagx}"
      find: "javax.servlet"
      replace: "jakarta.servlet"

  - id: javax-in-tld
    title: Rename javax.servlet classes in tag library descriptors
    category: B
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.tld"]
      pattern: "javax\\.servlet"
    fix:
      strategy: replace
      include: "**/*.tld"
      find: "javax.servlet"
      replace: "jakarta.servlet"

  # ---------------------------------------------------------------- C: removed or changed APIs

  - id: spring-framework-6
    title: Upgrade Spring Framework to 6.x
    category: C
    severity: BLOCKER
    detect:
      type: dependency
      coordinates: ["org.springframework:spring-*"]
      versionBelow: "6"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.framework.UpgradeSpringFramework_6_2]
    rationale: Spring 5 and earlier only support javax; Jakarta EE 10 needs Spring 6.

  - id: spring-assert-without-message
    title: Add messages to Spring Assert calls (message-less overloads removed)
    category: C
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.java"]
      pattern: "\\bAssert\\.(notNull|isNull|isTrue|hasText|hasLength|notEmpty|state|noNullElements|isInstanceOf)\\(\\s*[^,()]+(\\([^()]*\\))?\\s*\\)\\s*;"
    fix:
      strategy: recipe
      recipes: [org.openrewrite.java.spring.framework.MigrateSpringAssert]

  - id: handler-interceptor-adapter
    title: Replace HandlerInterceptorAdapter (removed in Spring 6)
    category: C
    severity: BLOCKER
    detect:
      type: import
      prefixes: [org.springframework.web.servlet.handler.HandlerInterceptorAdapter]
    fix:
      strategy: ai
      hint: >
        Change "extends HandlerInterceptorAdapter" to "implements AsyncHandlerInterceptor". The adapter
        was an empty implementation of that interface, so behaviour is unchanged.

  - id: commons-multipart-resolver
    title: Replace CommonsMultipartResolver with StandardServletMultipartResolver
    category: C
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.java", "**/*.xml"]
      pattern: "CommonsMultipartResolver"
    fix:
      strategy: ai
      hint: >
        Keep the same bean id and aliases. Move maxUploadSize / maxInMemorySize to <multipart-config>
        on the DispatcherServlet in web.xml (max-file-size, max-request-size, file-size-threshold)
        with identical values, so upload limits do not change.

  - id: commons-fileupload-1
    title: Move commons-fileupload 1.x code to fileupload2 (Jakarta)
    category: C
    severity: WARNING
    detect:
      type: import
      prefixes: [org.apache.commons.fileupload]
    fix:
      strategy: ai
      hint: >
        Use org.apache.commons.fileupload2.jakarta. fileupload2 lowered the default per-part header
        limit from 10240 to 512 bytes: set 10240 explicitly so long file names are not rejected. Keep
        the default charset (ISO-8859-1) if existing code re-decodes form fields.

  - id: spring-orm-ibatis
    title: Replace Spring's iBATIS 2 support (removed in Spring 4)
    category: C
    severity: BLOCKER
    detect:
      type: import
      prefixes: [org.springframework.orm.ibatis]
    fix:
      strategy: manual
      hint: >
        Either vendor an Apache-2.0 bridge (e.g. mybatis-2-spring) under its original package so
        callers do not change, or migrate the SQL maps to MyBatis 3 (much larger change).

  - id: cglib
    title: Remove direct cglib dependency
    category: C
    severity: WARNING
    detect: { type: dependency, coordinates: ["cglib:*"] }
    fix:
      strategy: manual
      hint: >
        cglib does not work on Java 17+ without --add-opens. Spring 6 repackages its own copy. If
        iBATIS 2 is used, cglib is only needed for nested-select lazy loading; when no SQL map uses
        it, removing cglib makes iBATIS fall back to reflection with identical results.

  - id: sun-misc-base64
    title: Replace sun.misc.BASE64Encoder/Decoder (removed in Java 9)
    category: C
    severity: BLOCKER
    detect:
      type: import
      prefixes: [sun.misc.BASE64Encoder, sun.misc.BASE64Decoder]
    fix:
      strategy: ai
      hint: >
        Use java.util.Base64. The sun decoder ignored line breaks and other non-alphabet characters;
        use Base64.getMimeDecoder() where input may contain them, otherwise getDecoder() throws.
        The sun encoder wrapped lines at 76 characters; use getMimeEncoder() only if callers rely on it.

  - id: jdk-internal-apis
    title: Remove other JDK-internal APIs (strongly encapsulated since Java 17)
    category: C
    severity: BLOCKER
    detect:
      type: import
      prefixes: ["sun.", "com.sun.image.codec", "com.sun.org.apache"]
      exclude: [sun.misc.BASE64Encoder, sun.misc.BASE64Decoder]
    fix:
      strategy: ai
      hint: Replace with the supported public API; do not add --add-opens unless no replacement exists.

  # ---------------------------------------------------------------- D: runtime and container behaviour

  - id: spring-mvc-url-matching
    title: Preserve Spring MVC URL matching (suffix and mid-path ** patterns)
    category: D
    severity: BLOCKER
    detect:
      type: dependency
      coordinates: ["org.springframework:spring-webmvc"]
      versionBelow: "6"
    fix:
      strategy: manual
      hint: >
        Spring 6 removed suffix matching ("/foo" no longer answers "/foo.do") and its PathPatternParser
        rejects "**" in the middle of a pattern, which stops startup. To keep the old behaviour,
        register an AntPathMatcher and <mvc:path-matching suffix-pattern="true" trailing-slash="true"
        path-matcher="pathMatcher"/>, then list ".do" forms explicitly where callers use them.

  - id: sitemesh2-tomcat10
    title: SiteMesh 2 decorated pages render blank on Tomcat 10.1/11
    category: D
    severity: BLOCKER
    detect: { type: dependency, coordinates: ["opensymphony:sitemesh"] }
    fix:
      strategy: manual
      hint: >
        Use the Jakarta build of SiteMesh 2 (opensymphony:sitemesh 2.6.0+). Tomcat 10.1/11 finishes the
        response after a forward (suspendWrappedResponseAfterForward), discarding SiteMesh's buffered
        output. Add <Context suspendWrappedResponseAfterForward="false" /> to
        src/main/webapp/META-INF/context.xml.

  - id: jboss-deployment-structure
    title: Review JBoss module dependencies for EAP 8 / WildFly 27+
    category: D
    severity: WARNING
    detect: { type: fileExists, include: ["**/jboss-deployment-structure.xml"] }
    fix:
      strategy: ai
      hint: >
        javax.* modules are renamed jakarta.* in EAP 8 / WildFly 27+. Update module names in
        exclusions and dependencies, and re-check every excluded subsystem still exists.

  - id: nashorn-script-engine
    title: Nashorn JavaScript engine (removed in Java 15)
    category: D
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.java"]
      pattern: 'getEngineByName\(\s*"(?i:nashorn|javascript|js|ecmascript)"\s*\)|import\s+jdk\.nashorn\.'
    fix:
      strategy: ai
      hint: >
        Java 15 removed Nashorn: ScriptEngineManager.getEngineByName returns null and the code fails at
        runtime even though it compiles. Add the standalone engine org.openjdk.nashorn:nashorn-core:15.7
        to this module's build file; it registers under the same engine names, so the Java code can stay
        as it is. Imports of jdk.nashorn.api.* become org.openjdk.nashorn.api.*.

  - id: security-manager
    title: SecurityManager use (deprecated for removal, disabled by default since Java 18)
    category: D
    severity: WARNING
    detect:
      type: fileContains
      include: ["**/*.java"]
      pattern: "System\\.(get|set)SecurityManager|AccessController\\.doPrivileged"
    fix:
      strategy: manual
      hint: Behaviour that relied on a SecurityManager must be enforced another way.

  # ---------------------------------------------------------------- Guards: checked on the migrated code
  # Guards run after the recipe, replace and AI stages and before the build is verified. They catch
  # problems those stages introduce or leave behind, and fix them deterministically where possible.

  - id: guard-container-apis-provided
    phase: guard
    title: Container-supplied Jakarta APIs must not be bundled in the WAR
    category: E
    severity: BLOCKER
    detect:
      type: dependency
      coordinates:
        - "jakarta.servlet:jakarta.servlet-api"
        - "jakarta.servlet.jsp:jakarta.servlet.jsp-api"
        - "jakarta.el:jakarta.el-api"
        - "jakarta.websocket:*"
        - "jakarta.annotation:jakarta.annotation-api"
        - "jakarta.platform:*"
      scopeNot: provided
      packaging: war
    fix:
      strategy: maven
      params: { action: setScope, scope: provided }
    rationale: >
      Tomcat and JBoss/WildFly supply these APIs. A second copy in WEB-INF/lib can cause class-loading
      conflicts. Automated dependency upgrades sometimes drop the original provided scope.

  - id: guard-platform-apis-provided
    phase: guard
    title: With the full Jakarta EE platform API provided, the APIs it contains must not be bundled
    category: E
    severity: BLOCKER
    detect:
      type: dependency
      whenDeclared: "jakarta.platform:jakarta.jakartaee-api"
      scopeNot: provided
      coordinates:
        - "jakarta.ejb:jakarta.ejb-api"
        - "jakarta.enterprise:jakarta.enterprise.cdi-api"
        - "jakarta.inject:jakarta.inject-api"
        - "jakarta.persistence:jakarta.persistence-api"
        - "jakarta.validation:jakarta.validation-api"
        - "jakarta.ws.rs:jakarta.ws.rs-api"
        - "jakarta.json:jakarta.json-api"
        - "jakarta.json.bind:jakarta.json.bind-api"
        - "jakarta.transaction:jakarta.transaction-api"
        - "jakarta.interceptor:jakarta.interceptor-api"
        - "jakarta.faces:jakarta.faces-api"
        - "jakarta.jms:jakarta.jms-api"
    fix:
      strategy: maven
      params: { action: setScope, scope: provided }
    rationale: >
      Declaring jakarta.jakartaee-api as provided means the application runs on a full Jakarta EE server
      (for example WildFly or JBoss EAP 8), which supplies these APIs. Recipes that split the old javaee-api
      umbrella into individual artifacts may add them with compile scope; bundled copies in WEB-INF/lib can
      cause class-loading conflicts. XML Binding is left out on purpose: whether the server supplies it
      depends on the container, so review jakarta.xml.bind-api and jaxb-runtime scopes for the target server.

  - id: guard-jaxb-implementation
    phase: guard
    title: A bundled Jakarta XML Binding API needs an implementation at runtime
    category: E
    severity: BLOCKER
    detect:
      type: dependency
      coordinates: ["jakarta.xml.bind:jakarta.xml.bind-api"]
      scopeNot: provided
      # An implementation is already there, or the full Jakarta EE server supplies one.
      unlessDeclared:
        - "org.glassfish.jaxb:jaxb-runtime"
        - "com.sun.xml.bind:jaxb-impl"
        - "org.eclipse.persistence:org.eclipse.persistence.moxy"
        - "jakarta.platform:jakarta.jakartaee-api"
    fix:
      strategy: maven
      params: { action: addDependency, dependency: "org.glassfish.jaxb:jaxb-runtime:4.0.5", scope: runtime }
    rationale: >
      Java 8 shipped JAXB with the JDK. After the move to jakarta.xml.bind the API compiles, but
      JAXBContext fails at runtime ("Implementation of Jakarta XML Binding-API has not been found")
      unless an implementation is on the classpath. jaxb-runtime 4.0.5 matches the 4.0.2 API.

  - id: guard-war-plugin-java17
    phase: guard
    title: maven-war-plugin must be 3.3.2 or newer to run on Java 17+
    category: A
    severity: BLOCKER
    detect:
      type: mavenPluginBelow
      plugin: maven-war-plugin
      version: "3.3.2"
      packaging: war
      whenUndeclared: true
    fix:
      strategy: maven
      params: { action: setPluginVersion, plugin: maven-war-plugin, version: "3.4.0" }
    rationale: >
      Older versions, including the default Maven 3 picks when none is declared, fail on Java 17+
      because they reflect into JDK internals. Declaring the version also makes builds reproducible.

  - id: guard-compiler-target
    phase: guard
    title: Compiler target level must match the source level
    category: A
    severity: BLOCKER
    detect:
      type: pomProperty
      missing: maven.compiler.target
      requires: maven.compiler.source
      unless: [maven.compiler.release]
    fix:
      strategy: maven
      params: { action: setProperty, name: maven.compiler.target, value: "${maven.compiler.source}" }
    rationale: >
      With only the source level raised, older compiler plugins keep a lower default target and the
      build fails ("source release 21 requires target release 21").

  - id: guard-imported-apis-declared
    phase: guard
    title: Jakarta APIs the code imports must be declared as dependencies
    category: E
    severity: BLOCKER
    detect:
      type: importWithoutDependency
      # Umbrella APIs that supply every package below.
      providedByAny: ["jakarta.platform:*"]
      provides:
        # Supplied by Tomcat 10.1/11 and WildFly/JBoss EAP: compile against them, do not bundle.
        - { package: jakarta.servlet.jsp, dependency: "jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1", scope: provided }
        - { package: jakarta.servlet, dependency: "jakarta.servlet:jakarta.servlet-api:6.0.0", scope: provided }
        - { package: jakarta.el, dependency: "jakarta.el:jakarta.el-api:5.0.1", scope: provided }
        - { package: jakarta.websocket, dependency: "jakarta.websocket:jakarta.websocket-api:2.1.1", scope: provided }
        - { package: jakarta.annotation, dependency: "jakarta.annotation:jakarta.annotation-api:2.1.1", scope: provided }
        # Not supplied by Tomcat: bundled with the application (an implementation is also needed at runtime).
        - { package: jakarta.xml.bind, dependency: "jakarta.xml.bind:jakarta.xml.bind-api:4.0.2" }
        - { package: jakarta.validation, dependency: "jakarta.validation:jakarta.validation-api:3.0.2" }
        - { package: jakarta.persistence, dependency: "jakarta.persistence:jakarta.persistence-api:3.1.0" }
        - { package: jakarta.inject, dependency: "jakarta.inject:jakarta.inject-api:2.0.1" }
    fix:
      strategy: maven
      params: { action: addDependency }
    rationale: >
      Java 8 itself supplied some javax packages (javax.annotation, javax.xml.bind), so legacy builds
      never declared them. After the rename to jakarta.*, nothing supplies them until the build
      declares the Jakarta EE 10 API. On WildFly/JBoss, packages bundled here may already be provided
      by the server; review the scope for those deployments.

  - id: guard-jstl-jakarta
    phase: guard
    title: JSTL must be the Jakarta version on Jakarta EE containers
    category: E
    severity: BLOCKER
    detect:
      type: dependency
      coordinates:
        - "javax.servlet:jstl"
        - "jstl:jstl"
        - "taglibs:standard"
        - "javax.servlet.jsp.jstl:*"
        - "org.glassfish.web:javax.servlet.jsp.jstl"
        - "org.apache.taglibs:taglibs-standard-*"
    fix:
      strategy: maven
      params:
        action: replaceDependency
        with: "jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0"
        alsoAdd: "org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1"
    rationale: >
      JSTL 1.x is built on javax.servlet.jsp. It compiles and deploys, but every JSP that uses a tag fails on
      Tomcat 10.1+ with NoClassDefFoundError: javax/servlet/jsp/tagext/TagLibraryValidator. Tomcat does not
      ship JSTL, so the Jakarta API and its implementation are bundled. Existing taglib URIs
      (http://java.sun.com/jsp/jstl/core) keep working with JSTL 3.0. Found by behavioural verification.

  - id: guard-dependency-version
    phase: guard
    title: Dependencies without a version need one when nothing manages them
    category: E
    severity: BLOCKER
    detect: { type: dependencyWithoutVersion }
    fix:
      strategy: maven
      params: { action: setVersion }
    rationale: >
      A recipe can rename an artifact in a module but rename the parent's managed entry differently (for
      example commons-fileupload2-jakarta-servlet5 in the module, -servlet6 in the parent), leaving the
      module's dependency without a version and the build broken. The version is taken from the managed
      artifact of the same family. Review whether the module should use the managed artifact instead.

  - id: guard-duplicate-dependencies
    phase: guard
    title: A dependency must be declared only once in a build file
    category: E
    severity: WARNING
    detect: { type: duplicateDependency }
    fix:
      strategy: maven
      params: { action: removeDuplicates }
    rationale: >
      Recipes that add a dependency can miss an existing declaration they renamed, leaving two copies that
      disagree on version or scope. Maven only warns. The first declaration, normally the project's own,
      is kept and later copies are removed.

  - id: guard-spring-assert-messages
    phase: guard
    title: Spring Assert calls left without a message (overloads removed in Spring 6)
    category: C
    severity: BLOCKER
    detect:
      type: fileContains
      include: ["**/*.java"]
      requires: 'org\.springframework\.util\.(Assert\b|\*)'
      pattern: '\bAssert\.(notNull|isNull|isTrue|state|hasText|hasLength)\(\s*[^,()]+(\([^()]*\))?\s*\)\s*;'
    fix:
      strategy: replace
      include: "**/*.java"
      regex: true
      params:
        # The messages the removed overloads used, so exception messages do not change.
        replacements:
          - find: '\bAssert\.notNull\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.notNull($1, "[Assertion failed] - this argument is required; it must not be null")$2'
          - find: '\bAssert\.isNull\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.isNull($1, "[Assertion failed] - the object argument must be null")$2'
          - find: '\bAssert\.isTrue\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.isTrue($1, "[Assertion failed] - this expression must be true")$2'
          - find: '\bAssert\.state\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.state($1, "[Assertion failed] - this state invariant must be true")$2'
          - find: '\bAssert\.hasText\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.hasText($1, "[Assertion failed] - this String argument must have text; it must not be null, empty, or blank")$2'
          - find: '\bAssert\.hasLength\(\s*([^,()]+?(?:\([^()]*\))?)\s*\)(\s*;)'
            replace: 'Assert.hasLength($1, "[Assertion failed] - this String argument must have length; it must not be null or empty")$2'
    rationale: >
      OpenRewrite's MigrateSpringAssert only converts calls whose argument types it can resolve. An
      argument whose type comes from a sibling module can leave a call unconverted, and Spring 6 no
      longer compiles it. Calls whose argument contains a comma or nested calls are left to the build
      and AI repair.

# ---------------------------------------------------------------- Knowledge cards
# Curated notes retrieved for AI requests when RAG is enabled (--rag). A card is sent when one of its
# triggers appears in the request's rules, build errors or target files. Written from public migration
# guides and release notes; never from customer code.

knowledge:

  - id: jdk-removed-java-ee-modules
    title: Java EE APIs that Java 8 supplied are gone from the JDK
    triggers: ["package jakarta.annotation does not exist", "package javax.annotation does not exist",
               "package javax.xml.bind does not exist", "package jakarta.xml.bind does not exist",
               "javax.annotation.PostConstruct", "jakarta.annotation.PostConstruct"]
    body: |
      Java 11 removed the Java EE and CORBA modules from the JDK (JEP 320): javax.annotation (JSR-250, e.g.
      @PostConstruct, @Resource), javax.xml.bind (JAXB), javax.xml.ws (JAX-WS), javax.activation. A Java 8
      build compiled against them without declaring anything. After javax → jakarta they must be declared:
      - jakarta.annotation:jakarta.annotation-api:2.1.1 (provided on Tomcat 10.1/11 and WildFly, which ship it)
      - jakarta.xml.bind:jakarta.xml.bind-api:4.0.2 plus an implementation (see the JAXB note)
      Fix this in the module's build file, not by changing the code that uses the annotations.

  - id: jaxb-needs-implementation
    title: Jakarta XML Binding needs an implementation at runtime
    triggers: ["JAXBContext", "jakarta.xml.bind", "javax.xml.bind", "DatatypeConverter",
               "Implementation of Jakarta XML Binding-API has not been found"]
    body: |
      The API jar (jakarta.xml.bind-api) compiles but JAXBContext.newInstance fails at runtime with
      "Implementation of Jakarta XML Binding-API has not been found" unless an implementation is on the
      classpath: org.glassfish.jaxb:jaxb-runtime:4.0.5 (runtime scope) matches API 4.0.2. Full Jakarta EE
      servers (WildFly, JBoss EAP 8) supply both; Tomcat supplies neither. jakarta.xml.bind.DatatypeConverter
      exists in the API jar; java.util.Base64 and java.util.HexFormat (Java 17) are JDK alternatives.

  - id: spring6-commons-multipart-removed
    title: Spring 6 removed CommonsMultipartResolver
    triggers: ["CommonsMultipartResolver", "commons-fileupload"]
    body: |
      Use org.springframework.web.multipart.support.StandardServletMultipartResolver, which relies on the
      servlet container's multipart support. Spring looks the resolver up by the bean name
      "multipartResolver"; keep that name. Limits move to the DispatcherServlet's <multipart-config> in
      web.xml (or a MultipartConfigElement): Commons maxUploadSize limited the whole request, so map it to
      max-request-size (and max-file-size, to keep per-file uploads at most as large); maxInMemorySize maps
      to file-size-threshold. Without a <multipart-config> the container rejects multipart requests.

  - id: commons-fileupload2-artifacts
    title: Apache Commons FileUpload 2 artifacts and packages
    triggers: ["commons-fileupload2", "org.apache.commons.fileupload"]
    body: |
      FileUpload 2 splits into artifacts per servlet API, each with its own package:
      commons-fileupload2-jakarta-servlet5 (org.apache.commons.fileupload2.jakarta.servlet5) for Servlet 5
      and commons-fileupload2-jakarta-servlet6 (...jakarta.servlet6) for Servlet 6 / Tomcat 10.1+. Keep the
      artifact, its version and the code's imports consistent; mixing the two leaves a dependency without a
      managed version or classes that do not resolve. FileUpload 2 lowered the default per-part header limit
      from 10240 to 512 bytes; set 10240 explicitly so long file names are still accepted.

  - id: nashorn-removed
    title: Nashorn was removed in Java 15
    triggers: ["nashorn", "getEngineByName", "ScriptEngineManager", "jdk.nashorn"]
    body: |
      Java 15 removed the Nashorn JavaScript engine (JEP 372). ScriptEngineManager.getEngineByName("nashorn"
      or "javascript") then returns null, so code compiles and fails at runtime with a NullPointerException.
      Add org.openjdk.nashorn:nashorn-core:15.7 (it needs Java 11+) to the module that runs scripts; it
      registers under the same engine names, so the Java code can stay unchanged. Direct imports of
      jdk.nashorn.api.* become org.openjdk.nashorn.api.*.

  - id: spring6-handler-interceptor-adapter
    title: Spring 6 removed HandlerInterceptorAdapter
    triggers: ["HandlerInterceptorAdapter"]
    body: |
      HandlerInterceptorAdapter was an empty implementation of AsyncHandlerInterceptor. Replace
      "extends HandlerInterceptorAdapter" with "implements AsyncHandlerInterceptor" (or HandlerInterceptor if
      afterConcurrentHandlingStarted is not overridden). The interfaces have default methods, so only the
      overridden methods are needed and behaviour does not change. Check superclasses too: a project base
      class may extend the adapter.

  - id: spring6-assert-messages
    title: Spring 6 removed the message-less Assert overloads
    triggers: ["org.springframework.util.Assert", "no suitable method found for notNull",
               "no suitable method found for isTrue", "no suitable method found for state"]
    body: |
      Assert.notNull(Object), isNull, isTrue, state, hasText, hasLength, notEmpty and noNullElements without a
      message were removed. Pass the message the removed overload used so exception text is unchanged, e.g.
      notNull: "[Assertion failed] - this argument is required; it must not be null"; isTrue:
      "[Assertion failed] - this expression must be true"; state: "[Assertion failed] - this state invariant
      must be true"; hasText: "[Assertion failed] - this String argument must have text; it must not be
      null, empty, or blank".

  - id: spring6-url-matching
    title: Spring 6 URL matching defaults changed
    triggers: ["RequestMapping", "useSuffixPatternMatch", "suffix-pattern", "PathPatternParser", "AntPathMatcher",
               "No more pattern data allowed after"]
    body: |
      Spring 6 matches URLs with PathPatternParser by default and dropped suffix pattern matching, so
      "/orders" no longer answers "/orders.do", and trailing-slash matching is off ("/orders/" no longer
      matches "/orders"). PathPatternParser also rejects "**" in the middle of a pattern, which stops startup
      with "No more pattern data allowed after {*...} or ** pattern element". To keep old behaviour, configure
      an AntPathMatcher with <mvc:path-matching path-matcher="..."/> and list ".do" forms explicitly.

  - id: servlet-container-versions
    title: Servlet and Jakarta EE versions by container
    triggers: ["jakarta.servlet-api", "web-app_6_0", "web-app_5_0", "jakarta.jakartaee-api"]
    body: |
      Tomcat 10.0 implements Servlet 5.0 (Jakarta EE 9), Tomcat 10.1 Servlet 6.0 (Jakarta EE 10), Tomcat 11
      Servlet 6.1 (Jakarta EE 11). WildFly 27+ and JBoss EAP 8 implement Jakarta EE 10. Compile against the
      target's API version with provided scope: jakarta.servlet:jakarta.servlet-api:6.0.0 for Tomcat 10.1 or
      jakarta.platform:jakarta.jakartaee-api:10.0.0 for a full Jakarta EE 10 server. Bundling the API in
      WEB-INF/lib causes class-loading conflicts.

  - id: jstl-jakarta
    title: JSTL on Jakarta EE containers
    triggers: ["jstl", "TagLibraryValidator", "java.sun.com/jsp/jstl"]
    body: |
      JSTL 1.2 (javax.servlet:jstl, jstl:jstl, taglibs:standard) uses javax.servlet.jsp and fails at runtime on
      Tomcat 10.1+ (NoClassDefFoundError: javax/servlet/jsp/tagext/TagLibraryValidator) although the build
      passes. Use jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0 with the implementation
      org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1; Tomcat does not ship JSTL, so bundle both. The old
      taglib URIs (http://java.sun.com/jsp/jstl/core) still work; jakarta.tags.core is the new form.

  - id: tomcat10-sitemesh2-forward
    title: SiteMesh 2 pages render blank on Tomcat 10.1/11
    triggers: ["sitemesh", "suspendWrappedResponseAfterForward"]
    body: |
      Tomcat 10.1+ finishes the response after a RequestDispatcher forward (suspendWrappedResponseAfterForward
      defaults to true), discarding output SiteMesh 2 buffered. Use the Jakarta build of SiteMesh 2
      (opensymphony:sitemesh 2.6.0+) and add <Context suspendWrappedResponseAfterForward="false" /> to
      src/main/webapp/META-INF/context.xml.
