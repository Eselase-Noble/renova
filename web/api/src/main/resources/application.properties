spring.application.name=renova-web-api
# Local by default: there is no authentication yet. Expose it only behind an authenticating proxy.
server.address=127.0.0.1
server.port=8787
# Projects, migration records and workspaces.
renova.data-dir=${user.home}/.renova/server
# Migrations run one at a time: each builds the project and may start containers.
renova.parallel-migrations=1
# Signed-in sessions: an HttpOnly cookie, not sent on cross-site requests. Set secure=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=12h
# Directories projects may be added from (comma-separated). Members cannot point Renova anywhere else.
renova.project-roots=${user.home}

# Single sign-on with your identity provider over OpenID Connect (Entra ID, Okta, Google Workspace, Keycloak).
# Off until renova.sso.client-id is set. Register this redirect address with the provider:
#   <renova.public-url>/api/auth/sso/callback/sso
# renova.public-url is the address people open the console at.
renova.public-url=http://localhost:3000
#renova.sso.name=Entra ID
#renova.sso.issuer=https://login.microsoftonline.com/<tenant-id>/v2.0
#renova.sso.client-id=
#renova.sso.client-secret=
# Who gets in without an invitation: people whose address is in one of these domains join the first
# organisation with this role (viewer, member or admin). Empty: only people with an account or an invitation.
#renova.sso.allowed-domains=example.com
#renova.sso.role=member
# true: passwords are refused and everyone signs in through the provider.
#renova.sso.only=false
