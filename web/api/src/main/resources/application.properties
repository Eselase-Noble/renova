spring.application.name=renova-web-api
# Local by default: there is no authentication yet. Expose it only behind an authenticating proxy.
server.address=127.0.0.1
server.port=8787
# Projects, migration records and workspaces.
renova.data-dir=${user.home}/.renova/server
# Migrations run one at a time: each builds the project and may start containers.
renova.parallel-migrations=1
