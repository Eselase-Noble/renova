spring.application.name=renova-web-api
# Local by default: there is no authentication yet. Expose it only behind an authenticating proxy.
server.address=127.0.0.1
server.port=8787
# Projects, migration records and workspaces.
renova.data-dir=${user.home}/.renova/server
# Migrations run one at a time: each builds the project and may start containers.
renova.parallel-migrations=1
# Signed-in sessions: an HttpOnly cookie, not sent on cross-site requests. Set secure=true behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=12h
# Directories projects may be added from (comma-separated). Members cannot point Renova anywhere else.
renova.project-roots=${user.home}
